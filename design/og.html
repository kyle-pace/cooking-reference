<!doctype html><html><head><meta charset="utf-8"><style>
/* Share card for kylepace.dev/cooking-reference/ (public/cooking-reference/og.png). Render with
   npm run og (share-card skill). Dark mode of the lab's own palette (src/styles/theme.css):
   dim-kitchen paper, pale ink, beet proportion bars as the one bold element. */
@font-face{font-family:A;src:url("../node_modules/@fontsource/atkinson-hyperlegible-next/files/atkinson-hyperlegible-next-latin-400-normal.woff2")}
@font-face{font-family:A;font-weight:700;src:url("../node_modules/@fontsource/atkinson-hyperlegible-next/files/atkinson-hyperlegible-next-latin-700-normal.woff2")}
:root{--bg:#131917;--ink:#e8eee9;--muted:#a3b1a9;--rule:#35423c;--beet:#ee8db4;--wash:#3a2330}
html,body{margin:0}
body{width:1200px;height:630px;background:var(--bg);color:var(--ink);font-family:A;overflow:hidden}
.card{box-sizing:border-box;width:1200px;height:630px;padding:72px;display:flex;flex-direction:column;justify-content:space-between}
.site{font-size:30px;color:var(--muted)}
h1{margin:0;font-size:92px;line-height:1.02;letter-spacing:-0.02em;font-weight:700}
.sub{margin:22px 0 0;max-width:960px;font-size:34px;line-height:1.3;color:var(--muted)}
.rows{display:grid;gap:14px;margin-top:8px}
.row{display:grid;grid-template-columns:230px 1fr;align-items:center;gap:24px;font-size:30px;font-weight:700}
.bar{height:22px;background:var(--wash)}.bar i{display:block;height:100%;background:var(--beet)}
</style></head><body>
<div class="card">
  <div class="site">kylepace.dev/cooking-reference</div>
  <div>
    <h1>Cooking reference</h1>
    <p class="sub">What goes with what, the ratios behind the classics, and blends and sauces.</p>
  </div>
  <div class="rows" aria-hidden="true">
    <div class="row"><span>Soy sauce</span><div class="bar"><i style="width:88%"></i></div></div>
    <div class="row"><span>Ginger</span><div class="bar"><i style="width:64%"></i></div></div>
  </div>
</div>
</body></html>
